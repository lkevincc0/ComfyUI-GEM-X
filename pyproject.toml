[project]
name = "comfyui-gem-x"
description = "Video motion capture with NVIDIA GEM-X (SOMA body) and retargeting to Mixamo / Unreal / Unity FBX characters, previewed in ComfyUI's 3D viewer."
version = "0.1.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
# ComfyUI-side dependencies only; the inference worker uses requirements-worker.txt (install.py).
dependencies = ["opencv-python-headless"]

[project.urls]
Repository = "https://github.com/lkevincc0/ComfyUI-GEM-X"
"Bug Tracker" = "https://github.com/lkevincc0/ComfyUI-GEM-X/issues"

[tool.comfy]
PublisherId = "lkevincc"
DisplayName = "ComfyUI-GEM-X"
Icon = ""

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "third_party"]

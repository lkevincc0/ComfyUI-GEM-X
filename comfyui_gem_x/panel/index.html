<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Studio · GEM-X</title>
<style>

padding:12px;font-size:12px;line-height:1.7;color:#42463d}input:not([type=checkbox]):not([type=range]),select{width:100%;background:#fbfcf9;border:1px solid var(--line);border-radius:7px;padding:10px;color:#42463d;font-size:12px}input[type=file]{font-size:11px!important}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.field{margin-bottom:17px}details{margin:17px 0;font-size:12px}summary{color:var(--muted);cursor:pointer}details .field{margin-top:13px}.hint{font-size:11px;margin-top:7px;color:var(--muted);line-height:1.6}.toggle{font-size:12px;font-weight:400;display:flex;align-items:center;gap:7px}.primary{border:0;background:var(--accent);color:white;border-radius:7px;padding:13px;width:100%;font-size:13px;font-weight:650;margin-top:12px}.primary:hover{background:#dd5925}.secondary{background:white;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:11px;color:#656d5c}.section-head{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.section-head h2{font-size:13px;margin:0;font-weight:600}.section-head small{font-size:10px;color:var(--muted)}.outputs{display:grid;gap:17px;min-width:0}.videos{display:grid;grid-template-columns:1fr 1fr;gap:17px}.video-wrap{aspect-ratio:1.3;background:#f0f2eb;position:relative;display:grid;place-items:center}.video-wrap video{width:100%;height:100%;position:absolute;object-fit:contain;background:#141713}.empty{color:#9ba38e;text-align:center;font-size:12px}.empty span{display:block;font-size:27px;margin-bottom:10px;font-weight:300}.status-card{padding:15px 18px}.status-line{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px}.status-line small{font-size:10px;color:var(--muted)}progress{width:100%;height:4px;accent-color:var(--accent);display:block;margin-top:12px}.steps{display:flex;gap:20px;margin-top:12px;font-size:10px;color:#a0a592}.steps .active{color:var(--accent);font-weight:650}.clip-range{position:relative;height:28px;--start:0%;--end:100%;background:linear-gradient(to right,#dce1d4 var(--start),#ef6b36 var(--start),#ef6b36 var(--end),#dce1d4 var(--end));background-size:100% 5px;background-repeat:no-repeat;background-position:center}.clip-range input{position:absolute;inset:0;width:100%;margin:0;background:transparent;pointer-events:none;appearance:none;-webkit-appearance:none}.clip-range input::-webkit-slider-thumb{pointer-events:auto;appearance:none;-webkit-appearance:none;width:15px;height:23px;border-radius:4px;border:2px solid #fff;box-shadow:0 0 2px #888;background:#ef6b36;cursor:ew-resize}.clip-range input::-moz-range-thumb{pointer-events:auto;width:12px;height:20px;background:#ef6b36;border:2px solid white;border-radius:4px}.viewer{height:365px;position:relative;background:#eff1eb}.viewer canvas{width:100%;height:100%;display:block}.viewer .empty{position:absolute;inset:0;display:grid;place-content:center;pointer-events:none}.viewer-tools{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line)}.viewer-tools input[type=range]{flex:1;min-width:40px;accent-color:var(--accent)}.viewer-tools button{border:1px solid var(--line);border-radius:5px;background:white;padding:5px 10px;font-size:11px}.viewer-tools select{width:65px;padding:5px}.viewer-tools small{font-size:10px;white-space:nowrap;color:var(--muted)}.rig-tabs{display:flex;gap:4px}.rig-tabs button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:5px;font-size:11px}.rig-tabs button[aria-selected=true]{background:#f8e8de;color:#bd542c}.downloads{padding:16px 18px;display:flex;flex-wrap:wrap;gap:8px}.downloads a{font-size:11px;color:#4d5946;padding:8px 11px;background:#f5f7f0;border:1px solid var(--line);border-radius:6px;text-decoration:none}.jobs{margin-top:19px;border-top:1px solid var(--line);padding-top:16px}.jobs select{margin-top:8px}#error{color:#b43a26;white-space:pre-wrap;font-size:12px;line-height:1.6;margin-top:12px;overflow-wrap:anywhere}footer{margin:20px 4vw;color:#909787;font-size:11px}[hidden]{display:none!important}@media(min-width:1500px){main{grid-template-columns:390px minmax(0,1fr)}.viewer{height:460px}}@media(max-width:850px){main{grid-template-columns:1fr}.intro{align-items:start}.badge{display:none}.form{padding:18px}.videos{gap:10px}.viewer{height:360px}.connection{margin-right:8px}header{padding:16px 4vw}.section-head{padding:12px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.mjs"}}</script></head>
<body><header><div class="brand"><i></i><span data-i18n="视频生成与动作捕捉">视频生成与动作捕捉</span></div><div><select id="language" aria-label="语言 / Language" style="width:104px;padding:6px;margin-right:15px"><option value="zh" data-i18n="中文">中文</option><option value="en">English</option></select><span class="connection" id="connection">连接中…</span></div></header>
<main><section class="card form"><div class="tabs" role="tablist"><button role="tab" id="generate-tab" aria-selected="true" data-i18n="文字生成视频">文字生成视频</button><button role="tab" id="upload-tab" aria-selected="false" data-i18n="上传视频动捕">上传视频动捕</button></div>
<form id="form"><div id="generate-fields"><div class="field"><label for="rules" data-i18n="约束提示词">约束提示词</label><textarea id="rules" style="min-height:200px"></textarea></div><div class="field"><label for="action" data-i18n="动作提示词">动作提示词</label><textarea id="action" required style="min-height:230px"></textarea></div><div class="row"><div><label for="duration" data-i18n="视频时长 · 秒">视频时长 · 秒</label><input id="duration" type="number" value="4" min="0.2" max="120" step="0.1" required></div><div><label for="aspect" data-i18n="画面比例">画面比例</label><select id="aspect"><option value="1:1 (Square)" data-i18n="1:1 正方形">1:1 正方形</option><option value="9:16 (Portrait Widescreen)" data-i18n="9:16 竖屏">9:16 竖屏</option><option value="16:9 (Widescreen)" data-i18n="16:9 横屏">16:9 横屏</option></select></div></div><div class="row"><div><label for="width" data-i18n="宽度">宽度</label><input id="width" type="number" min="32" max="16384" step="32" value="640"></div><div><label for="height" data-i18n="高度">高度</label><input id="height" type="number" min="32" max="16384" step="32" value="640"></div></div><div class="row"><div><label for="steps" data-i18n="采样步数">采样步数</label><input id="steps" type="number" min="1" step="1" value="4"></div><div><label for="seed" data-i18n="随机种子">随机种子</label><input id="seed" type="number" min="0" max="9007199254740991" value="0" step="1"></div></div><details><summary data-i18n="参考图与生成设置">参考图与生成设置</summary><div class="field"><label for="first-image" data-i18n="首帧参考图">首帧参考图</label><input type="file" id="first-image" accept="image/*"></div><div class="field"><label for="last-image" data-i18n="尾帧参考图">尾帧参考图</label><input type="file" id="last-image" accept="image/*"></div><label class="toggle"><input id="turbo" type="checkbox" checked><span data-i18n="Turbo 加速">Turbo 加速</span></label><div class="field"><label for="lora-strength" data-i18n="Turbo LoRA 强度">Turbo LoRA 强度</label><input id="lora-strength" type="number" step="0.1" value="1"></div></details></div>
<div id="upload-fields" hidden><label for="video-file" data-i18n="选择单人视频">选择单人视频</label><input type="file" id="video-file" accept="video/*"></div>
<details><summary data-i18n="更多设置">更多设置</summary><label class="toggle" style="margin-top:15px"><input type="checkbox" id="root-motion" checked><span data-i18n="保留角色在场景中的移动">保留角色在场景中的移动</span></label><div class="row"><div><label for="yaw" data-i18n="角色朝向 · 度">角色朝向 · 度</label><input id="yaw" type="number" min="-180" max="180" value="0"></div><div><label for="material" data-i18n="角色材质">角色材质</label><select id="material"><option value="auto" data-i18n="自动">自动</option><option value="original" data-i18n="原始材质">原始材质</option><option value="red" data-i18n="红色">红色</option><option value="orange" data-i18n="橙色">橙色</option><option value="gray" data-i18n="灰色">灰色</option><option value="blue" data-i18n="蓝色">蓝色</option></select></div></div></details>
<button type="submit" id="submit" class="primary" data-i18n="生成视频">生成视频</button><div id="error" role="alert" hidden></div></form>
<div class="jobs"><label for="jobs" data-i18n="任务记录">任务记录</label><select id="jobs"><option value="" data-i18n="暂无任务">暂无任务</option></select><p class="hint" id="job-detail">结果保存在服务器的 ComfyUI/output 中。</p></div></section>
<div class="outputs"><div class="card status-card"><div class="status-line"><span id="status" role="status">就绪，等待开始</span><small id="elapsed"></small></div><progress id="progress" max="100" value="0"></progress><div class="steps"><span data-stage="generation" data-i18n="01 视频生成">01 视频生成</span><span data-stage="capture" data-i18n="02 动作捕捉">02 动作捕捉</span><span data-stage="retarget" data-i18n="03 角色重定向">03 角色重定向</span><span data-stage="complete" data-i18n="04 完成">04 完成</span></div></div>
<div class="videos"><section class="card"><div class="section-head"><h2 id="source-title" data-i18n="生成视频">生成视频</h2><small>INPUT</small></div><div class="video-wrap"><div class="empty" id="source-empty"><span>▷</span><small data-i18n="视频将在这里显示">视频将在这里显示</small></div><video id="source-video" controls loop playsinline hidden></video></div></section><section class="card"><div class="section-head"><h2 data-i18n="动作捕捉预览">动作捕捉预览</h2><small>77 KEYPOINTS</small></div><div class="video-wrap"><div class="empty" id="pose-empty"><span>⌁</span><small data-i18n="等待动捕结果">等待动捕结果</small></div><video id="pose-video" controls loop playsinline hidden></video></div></section></div>
<section class="card" id="clip-controls" hidden><div class="section-head"><h2 data-i18n="选择动捕片段">选择动捕片段</h2><button id="select-all" class="secondary" type="button" data-i18n="选择全部">选择全部</button></div><div style="padding:16px 18px"><div class="clip-range" id="clip-range"><input id="trim-start-slider" aria-label="片段起点" data-i18n-aria="片段起点" type="range" min="0" max="1" step="0.01" value="0"><input id="trim-end-slider" aria-label="片段终点" data-i18n-aria="片段终点" type="range" min="0" max="1" step="0.01" value="1"></div><div class="row"><div><label for="trim-start" data-i18n="开始 · 秒">开始 · 秒</label><input id="trim-start" type="number" min="0" step="0.01" value="0"></div><div><label for="trim-end" data-i18n="结束 · 秒">结束 · 秒</label><input id="trim-end" type="number" min="0" step="0.01" value="0"></div></div><div class="status-line" style="margin-top:13px"><small id="clip-summary"></small><button id="preview-clip" class="secondary" type="button" data-i18n="播放选中片段">播放选中片段</button></div><button id="capture" class="primary" type="button" data-i18n="开始动作捕捉">开始动作捕捉</button></div></section><section class="card"><div class="section-head"><h2 data-i18n="角色动画">角色动画</h2><div class="rig-tabs" role="tablist" aria-label="角色"><button role="tab" data-rig="148" aria-selected="true">Mixamo</button><button role="tab" data-rig="150" aria-selected="false">Unreal</button><button role="tab" data-rig="152" aria-selected="false">Unity</button></div></div><div id="viewer" class="viewer"><div id="model-empty" class="empty"><span>⌘</span><small data-i18n="等待角色动画">等待角色动画</small></div></div><div class="viewer-tools"><button id="play" type="button" disabled data-i18n="播放">播放</button><input id="timeline" aria-label="动画时间" data-i18n-aria="动画时间" type="range" value="0" min="0" max="1" step="0.001" disabled><small id="time">0.00 / 0.00 s</small><select id="speed" aria-label="播放速度" data-i18n-aria="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><button id="reset-view" type="button" data-i18n="复位视角">复位视角</button></div><div style="padding:14px 18px 0"><button id="download-all" class="primary" type="button" disabled data-i18n="下载全部结果 ZIP">下载全部结果 ZIP</button></div><div id="downloads" class="downloads"><p data-i18n="动作参数与三套角色的 FBX 下载链接将在这里显示。">动作参数与三套角色的 FBX 下载链接将在这里显示。</p></div></section></div></main>
<script type="module" src="./panel.mjs"></script></body></html>
